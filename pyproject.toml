[project]
name = "sentinel-rat-pipeline"
version = "0.1.0"
requires-python = ">=3.13"
description = "Orchestration pipeline for Sentinel Rat project"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
authors = [
  { name="Tuyen Le", email="ssc@iwr.uni-heidelberg.de" },
  { name="Inga Ulusoy", email="ssc@iwr.uni-heidelberg.de" },
]
dependencies = [
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.51",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "watchdog>=4.0.0",
    "sentinel-rat-dashboard @ git+https://github.com/ssciwr/sentinel-rat-dashboard.git@main",
    "exifread>=3.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "testcontainers>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_rat_pipeline"]

# needed because sentinel-rat-dashboard is installed from a git URL
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
